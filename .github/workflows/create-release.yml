name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: create-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Determine version/tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          APP_VERSION=$(jq -r '.expo.version' app.json)

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

          echo "Tag: $TAG"
          echo "Version from tag: $VERSION"
          echo "Version from app.json: $APP_VERSION"

          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "❌ app.json version ($APP_VERSION) does not match tag version ($VERSION)"
            exit 1
          fi

      - name: Get previous tag
        id: previous
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV=$(git tag -l "v*" --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          if [ "$PREV" = "$TAG" ] || [ -z "$PREV" ]; then
            PREV=""
          fi
          echo "tag=$PREV" >> $GITHUB_OUTPUT
          echo "Previous tag: ${PREV:-<none>}"

      - name: Generate changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV="${{ steps.previous.outputs.tag }}"

          if [ -z "$PREV" ]; then
            RANGE=""
          else
            RANGE="${PREV}..${TAG}"
          fi

          echo "Generating changelog for range: ${RANGE:-<all commits>}"

          COMMITS=$(git log ${RANGE} --pretty=format:"%s|%an|%h" --no-merges)

          FEATURES=""
          FIXES=""
          CHORES=""
          DOCS=""
          OTHER=""

          while IFS='|' read -r message author hash; do
            [ -z "$message" ] && continue

            if [[ $message =~ ^feat(\(.+\))?:\ (.+)$ ]]; then
              FEATURES="${FEATURES}- ${BASH_REMATCH[2]} (${hash}) — ${author}\n"
            elif [[ $message =~ ^fix(\(.+\))?:\ (.+)$ ]]; then
              FIXES="${FIXES}- ${BASH_REMATCH[2]} (${hash}) — ${author}\n"
            elif [[ $message =~ ^chore(\(.+\))?:\ (.+)$ ]]; then
              CHORES="${CHORES}- ${BASH_REMATCH[2]} (${hash}) — ${author}\n"
            elif [[ $message =~ ^docs(\(.+\))?:\ (.+)$ ]]; then
              DOCS="${DOCS}- ${BASH_REMATCH[2]} (${hash}) — ${author}\n"
            else
              OTHER="${OTHER}- ${message} (${hash}) — ${author}\n"
            fi
          done <<< "$COMMITS"

          CHANGELOG="## Changes\n\n"

          [ -n "$FEATURES" ] && CHANGELOG="${CHANGELOG}### ✨ Features\n${FEATURES}\n"
          [ -n "$FIXES" ] && CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes\n${FIXES}\n"
          [ -n "$CHORES" ] && CHANGELOG="${CHANGELOG}### 🔧 Chores\n${CHORES}\n"
          [ -n "$DOCS" ] && CHANGELOG="${CHANGELOG}### 📚 Documentation\n${DOCS}\n"
          [ -n "$OTHER" ] && CHANGELOG="${CHANGELOG}### 📦 Other Changes\n${OTHER}\n"

          echo -e "$CHANGELOG" > changelog.md
          echo "--- Changelog ---"
          cat changelog.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          gh release create "$TAG" \
            --title "Release $VERSION" \
            --notes-file changelog.md \
            --latest
