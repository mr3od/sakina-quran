name: PR Check

on:
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Optional but high-signal: catches config/plugin issues without full native build
      - name: Expo prebuild smoke test
        run: npx expo prebuild --no-install

      - name: Build Expo web bundle
        run: npx expo export --platform web

      - name: Build summary
        run: |
          echo "## ✅ PR Checks Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Prebuild smoke test: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Web export: ✅" >> $GITHUB_STEP_SUMMARY

  version-check:
    name: Version Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if version bump is required
        id: need-bump
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1

          CHANGED="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          echo "Changed files:"
          echo "$CHANGED"

          # Require bump only for "release-impacting" changes
          # (adjust paths to your repo layout if needed)
          if echo "$CHANGED" | grep -Eq '^(app\.json|package\.json|pnpm-lock\.yaml|src/|app/|ios/|android/)'; then
            echo "required=true" >> $GITHUB_OUTPUT
            echo "Version bump is REQUIRED for these changes."
          else
            echo "required=false" >> $GITHUB_OUTPUT
            echo "Version bump is NOT required (docs/assets/ci-only)."
          fi

      - name: Get version from PR branch
        id: pr-version
        if: steps.need-bump.outputs.required == 'true'
        run: |
          PR_VERSION=$(jq -r '.expo.version' app.json)
          echo "version=$PR_VERSION" >> $GITHUB_OUTPUT
          echo "PR branch version: $PR_VERSION"

      - name: Get version from target branch
        id: target-version
        if: steps.need-bump.outputs.required == 'true'
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }} -- app.json
          TARGET_VERSION=$(jq -r '.expo.version' app.json)
          echo "version=$TARGET_VERSION" >> $GITHUB_OUTPUT
          echo "Target branch version: $TARGET_VERSION"
          git checkout HEAD -- app.json

      - name: Compare versions
        if: steps.need-bump.outputs.required == 'true'
        run: |
          PR_VERSION="${{ steps.pr-version.outputs.version }}"
          TARGET_VERSION="${{ steps.target-version.outputs.version }}"

          echo "Comparing versions:"
          echo "  PR branch: $PR_VERSION"
          echo "  Target branch (${{ github.base_ref }}): $TARGET_VERSION"

          if [ "$PR_VERSION" = "$TARGET_VERSION" ]; then
            echo "❌ ERROR: Version in app.json has not been updated!"
            echo "Please update the version in app.json before merging this PR."
            echo "You can use the 'Bump Version' workflow or update it manually."
            exit 1
          else
            echo "✅ SUCCESS: Version updated from $TARGET_VERSION to $PR_VERSION"
          fi

      - name: Skip summary
        if: steps.need-bump.outputs.required != 'true'
        run: |
          echo "## ℹ️ Version Check Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This PR only changes non-release-impacting files (docs/assets/ci)." >> $GITHUB_STEP_SUMMARY

  branch-flow-check:
    name: Branch Flow Enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch merge flow
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Source branch: $SOURCE_BRANCH"
          echo "Target branch: $TARGET_BRANCH"
          echo ""

          ALLOWED=false
          ERROR_MESSAGE=""

          # Hotfix exception
          if [[ "$SOURCE_BRANCH" == hotfix/* ]]; then
            echo "✅ Hotfix Exception: hotfix/* can merge into $TARGET_BRANCH"
            ALLOWED=true

          # Any branch can merge into development
          elif [ "$TARGET_BRANCH" = "development" ]; then
            echo "✅ Rule: Any branch can merge into development"
            ALLOWED=true

          # Only development (or release/*) can merge into main
          elif [ "$TARGET_BRANCH" = "main" ]; then
            if [ "$SOURCE_BRANCH" = "development" ] || [[ "$SOURCE_BRANCH" == release/* ]]; then
              echo "✅ Rule: development/release/* can merge into main"
              ALLOWED=true
            else
              echo "❌ Rule violation: Only development (or release/*) can merge into main"
              ERROR_MESSAGE="Only 'development' (or 'release/*') can be merged into 'main'.\nYour branch: $SOURCE_BRANCH\n\nCorrect flow: feature → development → main"
            fi

          else
            echo "✅ Non-protected target branch; allowing merge"
            ALLOWED=true
          fi

          if [ "$ALLOWED" = true ]; then
            exit 0
          else
            echo -e "$ERROR_MESSAGE"
            exit 1
          fi
