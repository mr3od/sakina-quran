name: PR Check

on:
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Enable pnpm FIRST
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate

      # 2. THEN Setup Node (now it can find pnpm for caching)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Critical: ensures app.json and native plugins are valid
      - name: Expo prebuild smoke test
        run: npx expo prebuild --no-install

      - name: Build Expo web bundle
        run: pnpm run export:full

      - name: Build summary
        run: |
          echo "## ✅ PR Checks Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Typecheck: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Prebuild smoke test: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Web export: ✅" >> $GITHUB_STEP_SUMMARY

  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    # 🚨 ONLY check versions when merging to MAIN (Release Candidates)
    if: github.base_ref == 'main'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if version bump is required
        id: need-bump
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"

          echo "Changed files:"
          echo "$CHANGED"

          # Regex matches code files. If these change, version must bump.
          if echo "$CHANGED" | grep -Eq '^(app\.json|package\.json|pnpm-lock\.yaml|src/|app/|ios/|android/|assets/)'; then
            echo "required=true" >> $GITHUB_OUTPUT
            echo "::notice::Release-impacting files changed. Version bump required."
          else
            echo "required=false" >> $GITHUB_OUTPUT
            echo "::notice::Only docs/CI changed. No version bump needed."
          fi

      - name: Get versions
        if: steps.need-bump.outputs.required == 'true'
        id: check
        run: |
          PR_VER=$(jq -r '.expo.version' app.json)

          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }} -- app.json
          TARGET_VER=$(jq -r '.expo.version' app.json)

          # Restore
          git checkout HEAD -- app.json

          echo "PR: $PR_VER | Target: $TARGET_VER"

          if [ "$PR_VER" = "$TARGET_VER" ]; then
            echo "::error::You are merging to MAIN but the version has not changed ($PR_VER)."
            echo "::error::Please bump the version in app.json to trigger a release."
            exit 1
          else
             echo "✅ Version bumped from $TARGET_VER to $PR_VER"
          fi

  branch-flow-check:
    name: Branch Flow Enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch merge flow
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          if [[ "$SOURCE" == hotfix/* ]]; then
            echo "✅ Hotfix exception allowed."
            exit 0
          fi

          if [ "$TARGET" = "development" ]; then
             echo "✅ Merge to development allowed."
             exit 0
          fi

          if [ "$TARGET" = "main" ]; then
            if [ "$SOURCE" = "development" ] || [[ "$SOURCE" == release/* ]]; then
              echo "✅ Promotion to main allowed."
              exit 0
            else
              echo "::error::Only 'development' can merge into 'main'."
              exit 1
            fi
          fi
