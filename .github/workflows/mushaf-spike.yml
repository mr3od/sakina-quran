name: Mushaf Text Spike

# Renders /mushaf-spike on real platform text stacks (HarfBuzz/CoreText)
# and uploads screenshots as artifacts — evidence for FEATURE_MAP §4-Q1
# (text-rendered vs image-based reader substrate).

on:
  workflow_dispatch:
  push:
    branches:
      - worktree-mushaf-text-spike

permissions:
  contents: read

concurrency:
  group: mushaf-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_PACKAGE: dev.mr3od.sakinaquran
  DEEP_LINK_BASE: sakina-quran://mushaf-spike

jobs:
  android:
    name: Android (HarfBuzz) rendering evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild native project
        run: npx expo prebuild -p android --no-install

      - name: Build release APK (debug-signed, embedded JS)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Render pages & capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            # Deterministic captures: kill all animations
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            mkdir -p screenshots

            wait_for_app() {
              for i in $(seq 1 30); do
                FOCUS=$(adb shell dumpsys window 2>/dev/null | grep -i mCurrentFocus || true)
                case "$FOCUS" in *$APP_PACKAGE*) return 0 ;; esac
                sleep 2
              done
              echo "::warning::app not in foreground after 60s (focus: $FOCUS)"
              return 1
            }

            FIRST=1
            for p in 1 2 50 302; do
              adb shell am start -W -a android.intent.action.VIEW \
                -d "${DEEP_LINK_BASE}?page=$p" >/dev/null 2>&1 || true
              # Cold start (first page) compiles ART + loads db/font: allow longer
              if [ "$FIRST" = "1" ]; then sleep 20; FIRST=0; else wait_for_app || true; sleep 4; fi
              adb exec-out screencap -p > "screenshots/android-p$p.png"
            done

      - name: Assert captures are valid renders
        run: |
          FAIL=0
          for f in screenshots/*.png; do
            SIZE=$(stat -c%s "$f")
            DIMS=$(identify -quiet -format "%wx%h" "$f" 2>/dev/null || echo "?x?")
            echo "$f: ${DIMS}, ${SIZE} bytes"
            if [ "$SIZE" -lt 20000 ]; then echo "::error::$f looks blank/corrupt (${SIZE} bytes)"; FAIL=1; fi
          done
          [ "$(ls screenshots/*.png | wc -l)" -eq 4 ] || { echo "::error::expected 4 captures"; FAIL=1; }
          exit $FAIL

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: mushaf-spike-android
          path: screenshots/
          retention-days: 7

  ios:
    name: iOS (CoreText) rendering evidence
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild native project
        run: npx expo prebuild -p ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build simulator app
        working-directory: ios
        run: |
          xcodebuild -workspace *.xcworkspace -list
          # Pick the app scheme by NAME — positional picks alphabetically-first
          # Pods scheme (EXConstants), which builds no usable app bundle.
          SCHEME=$(xcodebuild -workspace *.xcworkspace -list | awk '/Schemes:/{f=1;next} f&&NF{print $1}' | grep -i sakina | head -1)
          [ -n "$SCHEME" ] || { echo "::error::could not resolve app scheme"; exit 1; }
          echo "Using Xcode scheme: $SCHEME"
          set -o pipefail
          xcodebuild -workspace *.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -30
          APP=$(find build/Build/Products -maxdepth 3 -name '*.app' -type d | grep -i sakina | head -1)
          [ -n "$APP" ] || { echo "::error::app bundle not found in products"; find build/Build/Products -name '*.app'; exit 1; }
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Boot simulator, render pages & capture screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "Booting device $DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          mkdir -p screenshots

          xcrun simctl install "$DEVICE" "$APP_PATH"

          FIRST=1
          for p in 1 2 50 302; do
            xcrun simctl openurl "$DEVICE" "${DEEP_LINK_BASE}?page=$p" || true
            if [ "$FIRST" = "1" ]; then sleep 25; FIRST=0; else sleep 8; fi
            xcrun simctl io "$DEVICE" screenshot "screenshots/ios-p$p.png"
          done

      - name: Assert captures are valid renders
        run: |
          FAIL=0
          for f in screenshots/*.png; do
            SIZE=$(stat -f%z "$f")
            DIMS=$(sips -g pixelWidth -g pixelHeight "$f" 2>/dev/null | awk '/pixel/{printf "%s",$2" "}')
            echo "$f: ${DIMS}, ${SIZE} bytes"
            if [ "$SIZE" -lt 20000 ]; then echo "::error::$f looks blank/corrupt (${SIZE} bytes)"; FAIL=1; fi
          done
          [ "$(ls screenshots/*.png | wc -l)" -eq 4 ] || { echo "::error::expected 4 captures"; FAIL=1; }
          exit $FAIL

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: mushaf-spike-ios
          path: screenshots/
          retention-days: 7
