name: Auto Tag Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Read current version from app.json
        id: ver
        run: |
          VERSION=$(jq -r '.expo.version' app.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Determine if app.json version changed in this push
        id: changed
        run: |
          # Compare the pushed commit to its first parent (works for merge commits too)
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Before: $BEFORE"
          echo "After:  $AFTER"

          # If before is all zeros (rare), tag anyway based on current version
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Did app.json change at all?
          if git diff --name-only "$BEFORE" "$AFTER" | grep -qx "app.json"; then
            # Did expo.version change?
            BEFORE_VER=$(git show "$BEFORE:app.json" | jq -r '.expo.version' || echo "")
            AFTER_VER=$(git show "$AFTER:app.json" | jq -r '.expo.version' || echo "")
            echo "Before version: $BEFORE_VER"
            echo "After version:  $AFTER_VER"

            if [ -n "$BEFORE_VER" ] && [ "$BEFORE_VER" != "$AFTER_VER" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "changed=false" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: exists
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist."
          fi

      - name: Create and push tag
        if: steps.changed.outputs.changed == 'true' && steps.exists.outputs.exists == 'false'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"

          echo "✅ Pushed tag $TAG at commit ${{ github.sha }}"

      - name: Summary
        run: |
          echo "## 🏷️ Auto Tag Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ steps.ver.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ steps.ver.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- app.json version changed: ${{ steps.changed.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag already existed: ${{ steps.exists.outputs.exists }}" >> $GITHUB_STEP_SUMMARY
